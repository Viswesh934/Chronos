name: Deploy Frontend

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: apps/web

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Debug GitHub OIDC claims
        uses: actions/github-script@v8
        with:
          script: |
            const token = await core.getIDToken('sts.amazonaws.com');
            const payload = JSON.parse(
              Buffer.from(token.split('.')[1], 'base64url').toString()
            );

            console.log('=== GitHub OIDC Claims ===');
            console.log('Issuer:', payload.iss);
            console.log('Audience:', payload.aud);
            console.log('Subject:', payload.sub);
            console.log('Repository:', payload.repository);
            console.log('Repository owner:', payload.repository_owner);
            console.log('Ref:', payload.ref);
            console.log('Event:', payload.event_name);
            console.log('==========================');

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::136172187126:role/OIDC
          aws-region: ap-south-1
          role-session-name: GitHubActions

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Deploy to S3
        run: aws s3 sync ./dist "s3://${{ secrets.S3_BUCKET_NAME }}" --delete
